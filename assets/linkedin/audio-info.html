<!doctype html><meta charset="utf-8"><script>
(async()=>{
 const ac=new AudioContext({sampleRate:16000});
 const b=await ac.decodeAudioData(await(await fetch('elevenlabs-hope.mp3')).arrayBuffer());
 const x=b.getChannelData(0),rate=b.sampleRate,hop=Math.round(rate*.02),silent=[];let start=null;
 for(let i=0;i<x.length;i+=hop){let sum=0;for(let j=i;j<Math.min(i+hop,x.length);j++)sum+=x[j]*x[j];
  if(Math.sqrt(sum/hop)<.008){if(start===null)start=i/rate;}else if(start!==null){if(i/rate-start>.15)silent.push([+start.toFixed(2),+(i/rate).toFixed(2)]);start=null;}}
 const wav=new ArrayBuffer(44+x.length*2),v=new DataView(wav);const str=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i));};
 str(0,'RIFF');v.setUint32(4,36+x.length*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,x.length*2,true);
 for(let i=0;i<x.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,x[i]))*32767,true);
 await fetch('/output/elevenlabs-analysis.wav',{method:'POST',body:wav});
 const report={duration:b.duration,sampleRate:rate,silent};
 await fetch('/output/elevenlabs-audio-info.json',{method:'POST',body:JSON.stringify(report,null,2)});
 await fetch('/done',{method:'POST',body:JSON.stringify(report)});
})().catch(e=>fetch('/error',{method:'POST',body:e.stack}));
</script>
