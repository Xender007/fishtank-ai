<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"
  aria-label="The learning loop: 23 senses feed a growing neural network, which steers the fish; survivors breed the next generation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d324a"/><stop offset="1" stop-color="#04131f"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe3c6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6fe3c6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font: 600 15px ui-monospace, Consolas, monospace; fill: #e6f4f1; }
      .s { font: 12px ui-monospace, Consolas, monospace; fill: #8fb3bf; }
      .n { fill: #0b2433; stroke: #6fe3c6; stroke-width: 1.5; }
      .pulse { animation: p 2.4s ease-in-out infinite; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: .6s } .d3 { animation-delay: .9s }
      .d4 { animation-delay: 1.2s } .d5 { animation-delay: 1.5s }
      @keyframes p { 0%, 100% { fill: #0b2433 } 45% { fill: #f0a35e } }
      .flow { stroke-dasharray: 6 10; animation: f 1.2s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -32 } }
      @media (prefers-reduced-motion: reduce) { .pulse, .flow { animation: none } }
    </style>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- 1. SENSE -->
  <text x="70" y="44" class="t">1 · SENSE</text>
  <text x="70" y="64" class="s">23 numbers, egocentric</text>
  <g>
    <circle cx="96" cy="150" r="7" fill="#ff6b6b" filter="url(#glow)"/>
    <g stroke="#ff6b6b" stroke-opacity="0.5" stroke-width="1.2">
      <line x1="96" y1="150" x2="176" y2="110"/><line x1="96" y1="150" x2="186" y2="150"/>
      <line x1="96" y1="150" x2="176" y2="190"/><line x1="96" y1="150" x2="40" y2="100"/>
      <line x1="96" y1="150" x2="40" y2="200"/>
    </g>
    <text x="70" y="240" class="s">rays · wall · closing</text>
    <text x="70" y="258" class="s">pack · alarm · food</text>
  </g>

  <path d="M200 150 H262" stroke="url(#wire)" stroke-width="3" class="flow" fill="none"/>

  <!-- 2. THINK -->
  <text x="300" y="44" class="t">2 · THINK</text>
  <text x="300" y="64" class="s">a network that grows</text>
  <g stroke="#6fe3c6" stroke-opacity="0.35" stroke-width="1.3" fill="none">
    <path d="M292 100 L360 125 M292 150 L360 125 M292 200 L360 175 M292 150 L360 175
             M360 125 L428 150 M360 175 L428 150 M292 100 L428 150 M292 200 L428 150"/>
  </g>
  <circle cx="292" cy="100" r="9" class="n pulse"/>
  <circle cx="292" cy="150" r="9" class="n pulse d1"/>
  <circle cx="292" cy="200" r="9" class="n pulse d2"/>
  <circle cx="360" cy="125" r="9" class="n pulse d3"/>
  <circle cx="360" cy="175" r="9" class="n pulse d4"/>
  <circle cx="428" cy="150" r="11" class="n pulse d5"/>
  <text x="300" y="240" class="s">sum(w·x) + b → tanh</text>
  <text x="300" y="258" class="s">+ an evolved route critic</text>

  <path d="M446 150 H508" stroke="url(#wire)" stroke-width="3" class="flow" fill="none"/>

  <!-- 3. ACT -->
  <text x="530" y="44" class="t">3 · ACT</text>
  <text x="530" y="64" class="s">turn + thrust</text>
  <g transform="translate(590 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-18;18;-18" dur="2.4s" repeatCount="indefinite"/>
      <path d="M22 0 Q2 -9 -16 0 Q2 9 22 0 Z" fill="#6fe3c6"/>
      <path d="M-16 0 L-27 -7 L-24 0 L-27 7 Z" fill="#3fb89b"/>
    </g>
    <circle r="38" fill="none" stroke="#6fe3c6" stroke-opacity="0.18" stroke-dasharray="3 6"/>
  </g>
  <text x="530" y="240" class="s">turns inside a circle</text>
  <text x="530" y="258" class="s">the shark cannot fit</text>

  <path d="M650 150 H708" stroke="url(#wire)" stroke-width="3" class="flow" fill="none"/>

  <!-- 4. BREED -->
  <text x="722" y="44" class="t">4 · BREED</text>
  <text x="722" y="64" class="s">survivors pass it on</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#e6f4f1">
    <rect x="722" y="96" width="120" height="24" rx="6" fill="#123548"/>
    <text x="732" y="113">select ✓</text>
    <rect x="722" y="128" width="120" height="24" rx="6" fill="#123548"/>
    <text x="732" y="145">crossover ✓</text>
    <rect x="722" y="160" width="120" height="24" rx="6" fill="#123548"/>
    <text x="732" y="177">mutate ✓</text>
    <rect x="722" y="192" width="120" height="24" rx="6" fill="#123548">
      <animate attributeName="fill" values="#123548;#f0a35e;#123548" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="732" y="209">+neuron?</text>
  </g>
  <text x="722" y="258" class="s">repeat · forever</text>

  <!-- loop back -->
  <path d="M800 272 Q450 305 96 272" stroke="#f0a35e" stroke-opacity="0.45" stroke-width="2" fill="none" class="flow"/>
</svg>
